# Demonstration Model: Grokking in Modular Addition

experiment:
  task: "modular_addition"
  prime_modulus: 97
  train_split_ratio: 0.5
  random_seed: 42


model:
  architecture: "mlp"
  hidden_dim: 128

  # Weight decay supports grokking-like phase transitions
  weight_decay: 1.0

  learning_rate: 0.001
  max_epochs: 10000



protocol:

  # --------------------------------------------------------
  # Representation-level observation
  # --------------------------------------------------------

  representation_metric: "linear_CKA"


  # --------------------------------------------------------
  # Candidate structural marker criterion
  # --------------------------------------------------------

  representation_consistency_threshold: 0.85


  # --------------------------------------------------------
  # Behavioral regime identification
  # --------------------------------------------------------

  generalization_accuracy_threshold: 0.95


  # --------------------------------------------------------
  # Admissible experimental transformations
  # --------------------------------------------------------

  admissible_transformations:

    seed_variation: true

    data_split_variation: true

    optimizer_variation: false



  # --------------------------------------------------------
  # Negative controls
  # --------------------------------------------------------

  negative_controls:

    label_permutation: true

    seed_ablation: true



reporting:

  statuses:

    - rejected
    - indeterminate
    - candidate_retained
